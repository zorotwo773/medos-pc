# MedOS edge reverse proxy
#
# Sits between Tailscale Funnel (port 443 on the host) and the two app
# containers. Funnel terminates TLS on its end, so we listen plain HTTP
# on :80 inside the container network and trust X-Forwarded-* headers.
#
# Routing:
#   /api/*          → backend (FastAPI on :8002)  — strips /api prefix
#   /static/*       → backend  (auth-gated, see backend/static mount)
#   /amboss-static/ → backend
#   /utd-static/    → backend
#   everything else → frontend (Next standalone on :3000)
#
# Auth note: the auth gate lives inside the backend (cookie middleware) and
# inside Next.js (proxy.ts redirect). nginx is intentionally NOT enforcing
# auth — keeping it stupid makes routing easier to reason about.

worker_processes auto;
worker_rlimit_nofile 8192;

events {
    worker_connections 4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging — go to stdout/stderr so docker logs see it
    access_log /dev/stdout combined;
    error_log  /dev/stderr warn;

    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    server_tokens off;

    # Large enough for PDF uploads from the library ingest tool.
    # Tailscale Funnel itself has no body-size cap.
    client_max_body_size 500M;
    client_body_timeout  300s;
    proxy_read_timeout   300s;
    proxy_send_timeout   300s;

    # gzip on text/json/js/css — PDFs and images are already compressed
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript application/xml;
    gzip_vary on;
    gzip_min_length 1024;

    upstream medos_backend {
        server backend:8002;
        keepalive 16;
    }

    upstream medos_frontend {
        server frontend:3000;
        keepalive 16;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen      80 default_server;
        listen      [::]:80 default_server;
        server_name _;

        # Strip /api prefix before forwarding to FastAPI so /api/me → /me etc.
        location /api/ {
            proxy_pass         http://medos_backend/;
            proxy_http_version 1.1;
            proxy_set_header   Host               $host;
            proxy_set_header   X-Real-IP          $remote_addr;
            proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto  $scheme;
            proxy_set_header   X-Forwarded-Host   $host;
            proxy_set_header   Connection         $connection_upgrade;
            proxy_set_header   Upgrade            $http_upgrade;
            proxy_buffering    off;
        }

        # Backend-served static reference assets (kept as direct paths in app code)
        location ~ ^/(amboss-static|utd-static|static)/ {
            proxy_pass         http://medos_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host               $host;
            proxy_set_header   X-Real-IP          $remote_addr;
            proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto  $scheme;
            proxy_buffering    off;
        }

        # Everything else: Next.js
        location / {
            proxy_pass         http://medos_frontend;
            proxy_http_version 1.1;
            proxy_set_header   Host               $host;
            proxy_set_header   X-Real-IP          $remote_addr;
            proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto  $scheme;
            proxy_set_header   X-Forwarded-Host   $host;
            proxy_set_header   Connection         $connection_upgrade;
            proxy_set_header   Upgrade            $http_upgrade;
            proxy_buffering    off;
        }

        # Lightweight liveness — used by the host healthcheck script
        location = /_nginx_health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }
}
